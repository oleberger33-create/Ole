# Claude-Chat – Einstellungen
# Nach einer Änderung im Spiel „/claude laden“ eingeben (oder den Server neu starten).

# API-Schlüssel von https://platform.claude.com (Settings → API Keys, beginnt mit sk-ant-).
# Nur hier in dieser Datei eintragen – niemals in den Chat schreiben!
# Jede Frage kostet ein paar Cent über das Anthropic-Konto, dem der Schlüssel gehört.
api_schluessel=

# Wer Claude fragen darf (Spielernamen mit Komma). Leer lassen = alle Spieler.
spieler=FNGreg,korokchris

# So beginnt eine Frage im Chat (mehrere mit Komma). Beispiel: „@claude wie baue ich eine Eisenfarm?“
praefix=@claude,!claude

# Modell und Denk-Aufwand (low, medium, high, xhigh, max). „low“ antwortet am schnellsten.
modell=claude-opus-5-5
aufwand=low
max_tokens=4000

# Darf Claude im Minecraft Wiki nachschauen? (kostet pro Suche etwa 1 Cent extra)
web_suche=true
web_seiten=minecraft.wiki,modrinth.com

# Kostenbremse: höchstens so viele Fragen pro Spieler und Stunde
max_fragen_pro_stunde=40

# Gedächtnis: so viele Fragen merkt sich Claude pro Spieler; nach so vielen Minuten Pause beginnt ein neues Gespräch
verlauf_runden=8
vergessen_nach_minuten=30
